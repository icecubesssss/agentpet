<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stay in focus 🐰</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
        background: radial-gradient(circle at 50% 30%, #fdf3e7 0%, #f3e6d4 60%, #ecdcc4 100%);
        color: #4a3b2b;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: radial-gradient(circle at 50% 30%, #2a2320 0%, #211b18 60%, #191410 100%); color: #efe3d2; }
        .card { background: rgba(255,255,255,0.04); }
      }
      .card {
        max-width: 440px;
        width: 100%;
        text-align: center;
        background: rgba(255,255,255,0.5);
        border-radius: 22px;
        padding: 40px 32px;
        box-shadow: 0 18px 50px rgba(120,90,50,0.15);
      }
      .bun { font-size: 68px; line-height: 1; margin-bottom: 8px; }
      h1 { font-size: 22px; margin: 12px 0 6px; font-weight: 700; }
      .domain { font-weight: 700; }
      p { margin: 6px 0; opacity: 0.85; font-size: 15px; line-height: 1.5; }
      .reason {
        margin-top: 16px;
        font-size: 14px;
        display: inline-block;
        padding: 7px 14px;
        border-radius: 999px;
        background: rgba(180,130,70,0.16);
      }
      .btn {
        margin-top: 26px;
        display: inline-block;
        border: none;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        color: #fff;
        background: linear-gradient(180deg, #f0a860, #e0873b);
        padding: 12px 26px;
        border-radius: 14px;
        box-shadow: 0 6px 14px rgba(224,135,59,0.35);
      }
      .btn:active { transform: translateY(1px); }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="bun">🐰</div>
      <h1>Let's stay in focus</h1>
      <p><span class="domain" id="domain">This site</span> is paused while you focus.</p>
      <p>Your rabbit is cheering you on — back to it! ✨</p>
      <div class="reason" id="reason" hidden></div>
      <div>
        <button class="btn" id="back">Go back</button>
      </div>
    </div>
    <script src="blocked.js"></script>
  </body>
</html>
